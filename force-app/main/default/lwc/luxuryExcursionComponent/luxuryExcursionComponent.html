<template>
    <div class="container">
        <h2 class="title">Luxury Excursion</h2>

        <div class="header-row">
            <div class="name-cell">LUXURY EXCURSION</div>
            <div>EXCURSION/YACHT</div>
            <div>LOCATION</div>
            <div>DATE/TIME</div>
            <div>PRODUCT</div> 
            <div>HSI COST</div>
            <div>CONFIRMATION#</div>
            <div>EDIT</div>
<!--            <div>ADD</div> -->
        </div>

        <template for:each={excursions} for:item="exc">
            <div key={exc.Id} class="data-row">
                <div class="name-cell">
                    <a href={exc.recordUrl} target="_blank" class="record-link">
                        {exc.Name}
                    </a>
                </div>
                <div>{exc.Excursion_Yacht_Name__c}</div>
                <div>{exc.Location__c}</div>
                <div>
                    <lightning-formatted-date-time value={exc.Date_Time__c} month="2-digit" day="2-digit" year="numeric" hour="2-digit" minute="2-digit" hour12="true"></lightning-formatted-date-time>
                </div>
                
                <div>{exc.productName}</div>

                <div>
                    <lightning-formatted-number value={exc.HSI_Cost__c} format-style="currency" currency-code="USD"></lightning-formatted-number>
                </div>
                <div>{exc.Confirmation__c}</div>
                
                <div class="action-col">
                    <lightning-button label="EDIT" variant="brand" data-id={exc.Id} onclick={handleEdit} class="blue-btn"></lightning-button>
                </div>
<!--                <div class="action-col">
                    <lightning-button label="ADD" variant="brand" data-id={exc.Id} onclick={handleAdd} class="blue-btn"></lightning-button>
                </div> -->
            </div>
        </template>
    </div>
</template>
