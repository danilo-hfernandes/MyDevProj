<template>
     <div class="spinner">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" variant="brand" size="large">
            </lightning-spinner>
        </template>
    </div>
    <lightning-card>
        <!-- Card Header -->
        <div class="slds-p-around_medium slds-theme_shade">
            <h1 class="slds-text-heading_medium slds-text-align_center">Traveler Information</h1>
        </div>
        <div>
            <strong><p class ="slds-p-around_xx-small" style="color: red;">{displayError}</p></strong>
        </div>
        <div class="slds-m-around_medium">
            <!-- Two-column layout -->
            <div class="slds-grid slds-wrap slds-gutters">
                <!-- Datatable on the left -->
                <div class="slds-col slds-size_3-of-3 slds-p-right_medium">
                    <lightning-datatable
                        key-field="Id"
                        data={rows}
                        columns={columns}
                        hide-checkbox-column
                        onrowaction={handleRowAction}
                        draft-values={draftValues}
                        onsave={handleSave}
                        class="custom-datatable">
                    </lightning-datatable>
                </div>
            </div>
        </div>

        <!-- Footer section with the button on the right -->
        <div class="slds-m-around_medium slds-border_top slds-grid ">
            <!-- Footer button on the right -->
             <lightning-button 
                class="slds-m-around_xx-small"
                label="Add Traveler"
                variant="neutral"
                onclick={addRow}>
            </lightning-button>
            <lightning-button 
                class="slds-m-around_xx-small"
                label="Proceed"
                variant="brand"
                onclick={handleProceed}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
