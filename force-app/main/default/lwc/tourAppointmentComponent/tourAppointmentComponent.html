<template>
    <lightning-card>
        <div class="demo-only" style="padding:0.5rem; background:#1e4a7b;">
            <div class="slds-button-group" role="group">
                <button class="slds-button slds-button_inverse" style="width:150px;" onclick={handleRebookButton}>Book / Reschedule</button>
            </div>
        </div>
    </lightning-card>
    <lightning-card title="Appointment Schedule" icon-name="action:announcement" size="Full">

        <lightning-record-edit-form layout-type="Full" record-id={currentRecordId} object-api-name="Tour_appointment__c"
            onsuccess={handleSuccess} onsubmit={handleSubmit}>

            <lightning-messages></lightning-messages>
<!-- Tour Appointment Details Section -->
<div class="slds-box slds-p-around_medium slds-m-bottom_medium">
    <div class="slds-grid slds-gutters">

        <!-- First Column -->
        <div class="slds-col slds-size_1-of-2">
            <h2 class="slds-text-heading_medium slds-m-bottom_small">Info</h2>

            <div class="slds-grid slds-gutters">
                <!-- NEW FIELD -->
                <lightning-input-field field-name="Tee_Up_Agent__c"></lightning-input-field>
            </div>

            <div class="slds-grid slds-gutters">
                <lightning-input-field field-name="Appointment_Date__c" disabled></lightning-input-field>
            </div>



            <div class="slds-grid slds-gutters slds-wrap">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-around_x-small"
                    style="Padding: 0 0 0 3PX">
                    <label for="statusPicklist" class="slds-form-element__label">
                        Appointment Status:
                    </label>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3 slds-p-around_x-small label-Hide"
                    style="Padding:0px">
                    <lightning-combobox
                        id="statusPicklist"
                        name="status"
                        style="width:512X"
                        value={statusValue}
                        options={oppStatusOptions}
                        onchange={handleOppStatusChange}>
                    </lightning-combobox>
                </div>
            </div>
            <!-- NOT IN USE -->
            <!--
            <div class="slds-grid slds-gutters">
                <lightning-input-field field-name="Location__c" disabled></lightning-input-field>
            </div>

            <div class="slds-grid slds-gutters">
                <lightning-input-field field-name="Wave__c" disabled></lightning-input-field>
            </div>
            -->
        </div>

        <!-- Second Column -->
        <div class="slds-col slds-size_1-of-2">
            </br></br>

            <!-- NOT IN USE -->
            <!--
            <div class="slds-grid slds-gutters">
                <lightning-input-field field-name="Lead_Type__c" disabled></lightning-input-field>
            </div>
            -->

            <div class="slds-grid slds-gutters">
                <lightning-input-field field-name="Closing_Agents__c"></lightning-input-field>
            </div>

            <div class="slds-grid slds-gutters">
                <lightning-input-field field-name="Appointment_Time__c" disabled></lightning-input-field>
            </div>
<!--
            <div class="slds-grid slds-gutters">
                <lightning-input-field field-name="Opp_Status__c" ></lightning-input-field>
            </div>
-->
        </div>
    </div>
</div>

 
                <!-- Arrival Info Section 
            <div class="slds-text-align_center slds-m-top_medium">
            <div class="slds-box slds-p-around_medium slds-m-bottom_medium">
                <h2 class="slds-text-heading_medium slds-m-bottom_small">Transportation Information</h2>

                <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field field-name="Transportation_Check_in__c"></lightning-input-field>
                    </div>
                </div>

                <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field field-name="Transportation_Pickup__c"></lightning-input-field>
                    </div>
                </div>

                <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field field-name="Pickup_Date_Time__c"></lightning-input-field>
                    </div>
                </div>

                <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field field-name="No_Show__c"></lightning-input-field>

                </div>
            </div>

            <!-- Save Button - Center Aligned -->
                <lightning-button variant="brand" type="submit" name="Save" label="Save">
                </lightning-button>



        </lightning-record-edit-form>
    </lightning-card>

    <template if:true={isShowModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_full">
            <div class="slds-modal__container custom-modal-size">
                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <!-- Close Button -->
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" 
                            title="Close" 
                            onclick={hideModalBox}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>

                    <!-- Modal Title -->
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate bold-label">
                        Select Filters
                    </h2>
                </header>


                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium slds-box light-blue-background"
                    id="modal-content-id-1">
                    <div class="slds-grid input-container">
                        <div class="slds-col slds-size_1-of-4">
                            <lightning-input label="Check Availability" type="Date" value={datevalue}
                                onchange={handledatevalue} class="small-input"></lightning-input>
                        </div>

                        <!--<div class="slds-col slds-size_1-of-4"> -->
                            <!-- <lightning-input label="Time" type="Time" value={timeValue} onchange={handleTimeValue} class="small-input" timezone="GMT"></lightning-input>-->
                             <!--<lightning-combobox 
                            label="Time" 
                            value={timeValue} 
                            options={timeOptions}
                            onchange={handleTimeValue} class="small-input">
                            </lightning-combobox>
                        </div>-->
                    </div>

                    <!-- Wrapper for Data Table with No Data Message -->
                    <div class="datatable-wrapper" style="max-height: 500px; overflow-y: auto; overflow-x: auto;">
                        <div class='slds-box'>
                            <!-- Show Datatable if data exists -->
                            <template if:true={tourData.length}>
                                <lightning-datatable key-field="id" data={tourData} columns={columns}
                                    onrowselection={handleRowSelection} style="min-width: 800px;">
                                </lightning-datatable>
                            </template>

                            <!-- Show Message if no data is available -->
                            <template if:true={isNoTours}>
                                <p class="slds-text-color_error slds-text-heading_small slds-p-around_medium">
                                    No dates are available for the selected criteria.
                                </p>
                            </template>
                        </div>
                    </div>



                </div>

                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_brand" onclick={handleCancel}>Cancel</button>&nbsp;&nbsp;&nbsp;
                     <!-- Book Tour Button (Visible only when action button is available) -->
        <template if:true={isActionButtonVisible}>
            <button class="slds-button slds-button_brand" onclick={handleBookTour} disabled={isNoTours}>
                Book / Reschedule
            </button>
        </template>

        <!-- Disabled Button (Visible when action button is clicked) -->
        <template if:true={isDisabledButtonVisible}>
            <button class="slds-button slds-button_brand" disabled>
                Booking in Progress...
            </button>
        </template>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    
    <template if:true={isAgentModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- Wrap everything in a bordered div -->
                <div class="agent-modal-border">
                    <!-- Header -->
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Select Agents</h2>
                    </header>

                    <!-- Body -->
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-grid slds-gutters">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-combobox
                                    name="TeeUpAgent"
                                    label="Tee Up Agent"
                                    options={agentOptions}
                                    value={selectedTeeUpAgent}
                                    onchange={handleTeeUpChange}>
                                </lightning-combobox>
                            </div>

                            <div class="slds-col slds-size_1-of-2">
                                <lightning-combobox
                                    name="ClosingAgent"
                                    label="Closing Agent"
                                    options={agentOptions}
                                    value={selectedClosingAgent}
                                    onchange={handleClosingChange}>
                                </lightning-combobox>
                            </div>
                        </div>
                    </div>

                    <!-- Footer -->
                    <footer class="slds-modal__footer">
                        <lightning-button
                            variant="neutral"
                            label="Cancel"
                            onclick={closeAgentModal}>
                        </lightning-button>

                        <lightning-button
                            variant="brand"
                            label="Save"
                            onclick={saveAgentsAndContinue}>
                        </lightning-button>
                    </footer>
                </div>
                <!-- End agent-modal-border -->

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>



</template>
