<template>
    <div class="spinner">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" variant="brand" size="large">
            </lightning-spinner>
        </template>
    </div>
    <lightning-quick-action-panel header="Create Payment">
    <lightning-card>
        
        <div>
            <div class="slds-m-top_medium slds-m-bottom_x-large">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                Personal Details
                </h2>
                <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input label="First Name" value={firstName} onchange={handleInputChange} data-id="firstName" readonly={flag}></lightning-input>
                        <lightning-input label="Last Name" value={lastName} onchange={handleInputChange} data-id="lastName" readonly={flag}></lightning-input>
                        <lightning-input label="Phone" value={phone} onchange={handleInputChange} data-id="phone" readonly={flag}></lightning-input>
                        <lightning-input label="Email" value={email} onchange={handleInputChange} data-id="email" readonly={flag}></lightning-input>
                        <lightning-input class="slds-p-top_medium" label="Cardholder name and billing address are the same as above." value={flag} onchange={handleInputChange} data-id="flag" type="checkbox" checked></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input label="Billing Street" value={street} onchange={handleInputChange} data-id="street" readonly={flag}></lightning-input>
                        <lightning-input label="Billing City" value={city} onchange={handleInputChange} data-id="city" readonly={flag}></lightning-input>
                        <lightning-input label="Billing State" value={state} onchange={handleInputChange} data-id="state" readonly={flag}></lightning-input>
                        <lightning-input label="Billing Country" value={country} onchange={handleInputChange} data-id="country" readonly={flag}></lightning-input>
                        <lightning-input label="Billing ZipCode" value={zipCode} onchange={handleInputChange} data-id="zipCode" readonly={flag}></lightning-input>
                    </div>
                </div>
            </div>
            <div>
                <p style="color: red;">{displayMessage}</p>
            </div>
             <div class="slds-m-top_medium slds-m-bottom_x-large">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                Card Details
                </h2>
                <div class="slds-p-around_small">
                    Amount - <lightning-formatted-number value={totalAmount} format-style="currency" currency-code="USD"></lightning-formatted-number>
                </div>
                <lightning-input label="Card Number" value={cardNumber} onchange={handleInputChange} data-id="cardNumber" required></lightning-input>
                <lightning-input label="Card Type" value={cardType} onchange={handleInputChange} data-id="cardType" required></lightning-input>
                <lightning-input label="Card Expiration" value={cardExp} onchange={handleInputChange} data-id="cardExp" placeholder="05/25" required></lightning-input>
                <lightning-input label="CVV" value={cardCVV} onchange={handleInputChange} data-id="cardCVV" required></lightning-input>
             </div>
            <div class="slds-p-top_x-small">    
                <lightning-button  label="Submit" variant="brand" onclick={handleEncrypt}></lightning-button>
                <lightning-button class="slds-m-around_small" label="Cancel" variant="neutral" onclick={handleCancel}></lightning-button>
            </div>
            
        </div>
    </lightning-card>
    </lightning-quick-action-panel>
</template>
